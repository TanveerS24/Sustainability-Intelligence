services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: sustainability-server
    restart: unless-stopped
    ports:
      - "4001:4000"
    volumes:
      # Raw data and SQLite database persist in the project directory
      - ./server/data:/app/data
    env_file:
      - .env.example
    environment:
      - PORT=4000
      - RAW_DATA_DIR=/app/data/raw
      - DB_PATH=/app/data/sustainability.db
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/api/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: sustainability-client
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  mongodb:
    image: mongo:7.0
    container_name: sustainability-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  mongodb_data:

